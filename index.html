<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino game</title>
    <meta name="description" content="Dino suika game">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dino-game" >
        <div class="soft-sunshine" ></div> 


    <header class="header">
        <!-- Левая часть -->
        <div class="header-left">
        <div class="text-wrapper" >ДиноGame</div> 
        <div class="div" >Cчастливый динозавр</div>
        </div>
        <!-- Правая часть -->
        <div class="replay-button" >
            <div class="text-wrapper-3" >↻</div>
            <div class="text-wrapper-4" >Рестарт</div>
    </div>
    </header>
    <!-- ОСНОВНАЯ ЧАСТЬ СТРАНИЦЫ -->
<main class="game-main-content">
    <!-- 1. ДОСКА РЕЗУЛЬТАТОВ И СЧЕТА -->
    <section class="scoreboard">

        <div class="scores-grid">
            <!-- Левая колонка: Текущий счет -->
            <div class="current-score">
                <div class="text-wrapper-6">Текущий счёт</div>
                <div class="text-wrapper-7">1,280</div>
                <div class="text-wrapper-8">Продолжай!</div>
            </div>

            <!-- Центральная колонка: Личный рекорд -->
            <div class="best-score">
                <div class="text-wrapper-9">Лучший счёт</div>
                <div class="text-wrapper-10">2,460</div>
                <div class="text-wrapper-11">*</div>
            </div>

            <!-- Правая колонка: Следующий фрукт -->
            <div class="next-fruit">
                <div class="text-wrapper-12">Следующий</div>
                <div class="text-wrapper-13">Диллофозавр</div>
                <div class="text-wrapper-14">Ночной кошмар.</div>
                <div class="peach-preview"></div>
                <div class="text-wrapper-15">&gt;…</div>
            </div>

    </div>
    </section>

    <section class="glass-play-box">
        <!-- Тени и стеклянные элементы декора -->
        <div class="glass-base-shadow"></div>
        <div class="transparent-glass"></div>
        <div class="inner-glass-edge"></div>
        <div class="left-glass"></div>
        <div class="right-glass"></div>
        <div class="glass-rim"></div>

        <!-- Ограничитель (dotted line) -->
        <img class="fruit-limit-dotted" src="https://c.animaapp.com/iRdb4EGuUIqRKCxWRdShig/img/fruit-limit-dotted-line.svg" alt="limit line">
        <div class="text-wrapper-16">не заходи за черту</div>

        <!-- Зона, куда падают динозавры (сюда будет смотреть Engine/Render из Matter.js) -->
        <div class="game-canvas-area"></div>
    </section>

    <section class="game-clues">
        <img src="images/clue.png" alt="Подсказка">
    </section>
</main>

<footer class="game-footer"></footer>
<!-- Подключение JavaScript -->
    <script src="js/matter.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
